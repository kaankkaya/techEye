<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechEye — Detection API Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0A0E1A;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px;
      gap: 24px;
    }
    h1 { font-size: 24px; font-weight: 700; }
    .subtitle { color: #8899aa; font-size: 14px; }

    .card {
      background: #141b2d;
      border: 1px solid #1e2d45;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    label { font-size: 13px; color: #8899aa; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

    input[type="text"] {
      background: #0d1220;
      border: 1px solid #1e2d45;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      padding: 10px 14px;
      width: 100%;
    }
    input[type="text"]:focus { outline: none; border-color: #1A8FE3; }

    .drop-zone {
      border: 2px dashed #1e2d45;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .drop-zone:hover, .drop-zone.over { border-color: #1A8FE3; }
    .drop-zone input { display: none; }
    .drop-zone p { color: #8899aa; font-size: 14px; margin-top: 8px; }

    #preview {
      display: none;
      width: 100%;
      border-radius: 10px;
      max-height: 300px;
      object-fit: contain;
      background: #0d1220;
    }

    button {
      background: #1A8FE3;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1578c2; }
    button:disabled { background: #2a3a4a; cursor: not-allowed; }

    #status {
      font-size: 13px;
      color: #8899aa;
      text-align: center;
      min-height: 20px;
    }

    .result-block {
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .detected-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag {
      background: #1A8FE322;
      border: 1px solid #1A8FE3;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 13px;
      color: #1A8FE3;
    }
    .tag.none { border-color: #666; color: #666; background: transparent; }

    .raw-label { font-size: 13px; color: #8899aa; margin-top: 4px; }
    pre {
      background: #0d1220;
      border: 1px solid #1e2d45;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      color: #aabbcc;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 300px;
      overflow-y: auto;
    }
    .error { color: #e35a1a; font-size: 13px; }
  </style>
</head>
<body>
  <h1>TechEye — Detection Test</h1>
  <p class="subtitle">Uses the same Gemini API call as the mobile app</p>

  <div class="card">
    <div>
      <label>Gemini API Key</label>
      <input type="text" id="apiKey" placeholder="AIza..." spellcheck="false" />
    </div>

    <div>
      <label>Image</label>
      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/*" />
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8899aa" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <p>Click or drag an image here</p>
      </div>
      <img id="preview" alt="preview" />
    </div>

    <button id="runBtn" disabled>Run Detection</button>
    <div id="status"></div>
  </div>

  <div class="card result-block" id="resultBlock">
    <label>Detected Objects</label>
    <div class="detected-list" id="detectedList"></div>

    <div class="raw-label">Raw Gemini Response</div>
    <pre id="rawResponse"></pre>
  </div>

  <script>
    const PROMPT =
      "You are an object detection system for a visually impaired person's assistant app. " +
      "Analyze this image and identify the following objects ONLY if they appear close or prominent in the frame: " +
      "person, car, dog, bicycle, truck, bus, cat. " +
      "Ignore objects that are small or far away. " +
      "Return ONLY a valid JSON array with no markdown, no code block, no extra text. Example: " +
      '[{"label":"person","confidence":0.95},{"label":"car","confidence":0.8}] ' +
      "If no relevant objects are close or prominent, return exactly: []";

    let base64Image = null;

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const runBtn = document.getElementById('runBtn');
    const status = document.getElementById('status');
    const resultBlock = document.getElementById('resultBlock');
    const detectedList = document.getElementById('detectedList');
    const rawResponse = document.getElementById('rawResponse');
    const apiKeyInput = document.getElementById('apiKey');

    // Load saved API key
    apiKeyInput.value = localStorage.getItem('techeye_gemini_key') || '';
    apiKeyInput.addEventListener('input', () => {
      localStorage.setItem('techeye_gemini_key', apiKeyInput.value.trim());
    });

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('over');
      handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

    function handleFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const dataUrl = e.target.result;
        preview.src = dataUrl;
        preview.style.display = 'block';
        // Strip the data URL prefix to get raw base64
        base64Image = dataUrl.split(',')[1];
        runBtn.disabled = false;
        resultBlock.style.display = 'none';
        status.textContent = '';
      };
      reader.readAsDataURL(file);
    }

    runBtn.addEventListener('click', runDetection);

    async function runDetection() {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) { status.textContent = '⚠️ Enter your Gemini API key first.'; return; }
      if (!base64Image) { status.textContent = '⚠️ Upload an image first.'; return; }

      runBtn.disabled = true;
      resultBlock.style.display = 'none';
      status.textContent = 'Sending to Gemini…';

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
      const body = {
        contents: [{
          parts: [
            { inline_data: { mime_type: 'image/jpeg', data: base64Image } },
            { text: PROMPT }
          ]
        }],
        generationConfig: { temperature: 0, maxOutputTokens: 256 }
      };

      const t0 = Date.now();
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const elapsed = Date.now() - t0;
        const data = await res.json();

        if (!res.ok) {
          status.innerHTML = `<span class="error">API error ${res.status}: ${data?.error?.message ?? JSON.stringify(data)}</span>`;
          rawResponse.textContent = JSON.stringify(data, null, 2);
          resultBlock.style.display = 'flex';
          detectedList.innerHTML = '';
          return;
        }

        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text ?? '[]';
        rawResponse.textContent = rawText;

        let parsed = [];
        try {
          const cleaned = rawText.trim().replace(/```json|```/g, '').trim();
          parsed = JSON.parse(cleaned);
        } catch {
          status.innerHTML = `<span class="error">Could not parse response as JSON</span>`;
          resultBlock.style.display = 'flex';
          detectedList.innerHTML = '';
          return;
        }

        status.textContent = `✓ Done in ${elapsed}ms`;
        detectedList.innerHTML = parsed.length === 0
          ? '<span class="tag none">No objects detected</span>'
          : parsed.map(d =>
              `<span class="tag">${d.label} — ${(d.confidence * 100).toFixed(1)}%</span>`
            ).join('');

        resultBlock.style.display = 'flex';
      } catch (err) {
        status.innerHTML = `<span class="error">Network error: ${err.message}</span>`;
      } finally {
        runBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
